<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#22134a"/>
      <stop offset="0.55" stop-color="#0d0a1c"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#E4DAFF"/>
      <stop offset="0.45" stop-color="#B49BFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="500" cy="540" r="270" fill="#fff"/>
      <circle cx="628" cy="436" r="232" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="500" cy="540" r="420" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>
  <rect width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
  <circle cx="512" cy="140" r="70" fill="url(#dotGlow)"/>
  <circle cx="512" cy="140" r="30" fill="#34D399"/>
</svg>
